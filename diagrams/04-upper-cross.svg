<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1068" viewBox="0 0 800 1068">
<rect width="800" height="1068" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Верхний крест</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">elbow cross screen</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M146 184 L219.0 180.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><line x1="219.5" y1="189.0" x2="218.5" y2="171.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><path d="M247 200 Q190 232 144.9 206.7" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="140.0,204.0 149.0,204.2 144.9,211.6" fill="#534AB7"/><path d="M212 166 L204.9 121.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="204.0,116.0 209.4,123.2 201.1,124.6" fill="#534AB7"/><circle cx="65" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="65" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="77" cy="139" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M72 139 L82 139 M77 134 L77 144" stroke="#854F0B" stroke-width="0.6"/><circle cx="132" cy="183" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="132" y="187.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="256" cy="188" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="256" y="192.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="234" cy="168" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="234" y="172.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="182" cy="170" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="182" y="173.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="190" cy="236" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="190" y="239.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="226" cy="128" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="226" y="131.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Та же идея на уровне линии штрафного (элбоу).</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O4 ставит заслон поперёк на X3, защитника O3.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O3 выходит на ближний к мячу элбоу, получает пас</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    лицом к кольцу: бросок, проход или передача.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O4 после заслона выходит наверх под бросок.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Если защитник O4 помог на O3 — открыт O4 наверху.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Часто используется как вход в позиционную атаку.</text>
<text x="60" y="1014" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · «Т» — заслон на защитника X · цифры — порядок</text>
</svg>