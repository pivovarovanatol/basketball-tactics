<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Через угол в пост</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 3-2</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M324 196 L340.6 260.6" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="342.0,266.0 335.9,259.3 344.1,257.2" fill="#6B6A64"/><path d="M332 272 L276.9 242.6" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="272.0,240.0 281.0,240.1 277.1,247.5" fill="#6B6A64"/><path d="M54 288 L142.4 288.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="148.0,288.0 140.0,292.2 140.0,283.8" fill="#534AB7"/><path d="M250 244 L167.1 279.8" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="162.0,282.0 167.7,275.0 171.0,282.7" fill="#6B6A64"/><circle cx="148" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="148" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="320" cy="182" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320" y="186.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="332" cy="171" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M327 171 L337 171 M332 166 L332 176" stroke="#854F0B" stroke-width="0.6"/><circle cx="258" cy="232" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="258" y="236.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="40" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="40" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="190" cy="148" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="152.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="110" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="270" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="270" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="230" cy="280" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="230" y="284.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="314" cy="290" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="314" y="294.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="344" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="344" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="300" cy="236" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="300" y="239.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="100" cy="300" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="100" y="303.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="206" cy="284" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="206" y="287.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Через угол — в пост. Внизу всего двое защитников.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. Мяч на крыле у O2 — отдаёт в угол на O4.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Нижний X5 вынужден выйти в угол, X4 смещается к O5.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O4 отдаёт O5 в пост.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. Левая сторона пустая — O3 уходит из угла под кольцо,</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">4. O5 отдаёт ему — лэй-ап с другой стороны.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Никто не сместился — O5 играет один в один у кольца.</text>
<text x="60" y="1014" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text>
</svg>