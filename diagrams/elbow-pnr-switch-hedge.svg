<text x="810.0" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2C2C2A">Пик-н-ролл: смена и хедж</text>
<g transform="translate(10 110)"><rect x="5" y="5" width="790" height="1126" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Пик-н-ролл против смены</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">switch</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M306 122 Q330 195 276.1 246.1" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="272.0,250.0 274.9,241.4 280.7,247.5" fill="#534AB7"/><path d="M238 163 Q222 210 202.7 245.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="200.0,250.0 200.2,241.0 207.5,245.0" fill="#534AB7"/><path d="M190 258 L55.5 277.2" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="50.0,278.0 57.3,272.7 58.5,281.0" fill="#6B6A64"/><circle cx="300" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="300" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="312" cy="101" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M307 101 L317 101 M312 96 L312 106" stroke="#854F0B" stroke-width="0.6"/><circle cx="280" cy="132" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="280" y="136.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="244" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="244" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="252" cy="124" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="252" y="128.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="318" cy="266" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="318" y="270.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="80" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="110" cy="174" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="178.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="35" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="35" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="120" cy="236" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="120" y="240.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><text x="236" y="112" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D85A30">смена</text><circle cx="334" cy="170" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="334" y="173.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="206" cy="206" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="206" y="209.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="120" cy="286" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="120" y="289.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Защита меняется: X5 на O1, X1 на O5.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Получаются два мисматча — их и атакуем.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 проходит против медленного X5 к кольцу.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O5 закрывает маленького X1 спиной, ловит у кольца.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. X4 помог на O5 — отдача в левый угол на O4.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X2 помог на проход — пас в правый угол на O2.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Если защита меняется заранее — O5 не доводит заслон</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    и сразу ныряет к кольцу (слип).</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — опции</text></g>
<g transform="translate(810 110)"><rect x="5" y="5" width="790" height="1126" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Пик-н-ролл против хеджа</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">hedge / show</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M250 104 Q204 132 213.1 190.5" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="214.0,196.0 208.6,188.7 216.9,187.4" fill="#D85A30"/><path d="M133 244 L170.6 254.5" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="176.0,256.0 167.2,257.9 169.4,249.8" fill="#D85A30"/><path d="M256 154 Q262 220 216.1 262.2" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="212.0,266.0 215.0,257.5 220.7,263.7" fill="#534AB7"/><path d="M200 274 L55.6 279.8" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="50.0,280.0 57.8,275.5 58.2,283.9" fill="#6B6A64"/><path d="M316 92 L334.2 72.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="338.0,68.0 335.7,76.7 329.5,71.1" fill="#534AB7"/><circle cx="296" cy="108" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="296" y="112.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="308" cy="97" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M303 97 L313 97 M308 92 L308 102" stroke="#854F0B" stroke-width="0.6"/><circle cx="262" cy="94" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="262" y="98.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="250" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="276" cy="146" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="276" y="150.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="318" cy="266" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="318" y="270.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="80" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="110" cy="174" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="178.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="35" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="35" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="120" cy="240" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="120" y="244.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><text x="262" y="74" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D85A30">хедж</text><circle cx="272" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="272" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="120" cy="294" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="120" y="297.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="342" cy="94" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="342" y="97.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Хедж: X5 выпрыгивает наверх и выдавливает O1,</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">потом бежит назад к O5. На миг O5 без защитника.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O5 сразу ныряет к кольцу — пас на ролл над хеджем.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. X4 помог на ролл — O5 отдаёт в левый угол на O4.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O1 не лезет в хедж: отводит мяч назад, тянет X5</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    за собой и даёт O5 время уйти вниз.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Шорт-ролл: O5 ловит у штрафной, 4 на 3 — бросок,</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    флоатер или передача в угол.</text>
<text x="60" y="1032" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Щель между X1 и X5 — O1 проходит между ними (сплит).</text>
<text x="60" y="1082" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — опции</text></g>
</svg>