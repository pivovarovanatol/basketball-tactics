<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1136" viewBox="0 0 800 1136">
<rect width="800" height="1136" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Пик-н-ролл: расстановка</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">на элбоу</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M258 248 Q264 190 252.0 147.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><line x1="260.7" y1="144.6" x2="243.3" y2="149.4" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><path d="M232 258 L230.2 215.6" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="230.0,210.0 234.5,217.8 226.1,218.2" fill="#D85A30"/><circle cx="288" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="288" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="300" cy="101" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M295 101 L305 101 M300 96 L300 106" stroke="#854F0B" stroke-width="0.6"/><circle cx="274" cy="130" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="274" y="134.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="258" cy="262" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="258" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="232" cy="272" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="276.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="318" cy="266" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="318" y="270.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="80" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="110" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="35" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="35" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="122" cy="256" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="122" y="260.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="278" cy="200" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="278" y="203.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><text x="238" y="151" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#534AB7">заслон</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Атака: четверо снаружи, углы заняты.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O1 — с мячом в правом слоте, над элбоу.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O5 выходит с блока и ставит заслон на X1 у элбоу.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O2 — правый угол, O3 — левое крыло, O4 — левый угол.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Защита:</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X1 — на O1, проходит над заслоном или под ним.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X5 — опускается в «дроп» к линии штрафного.</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X4 — «нижний»: страхует проход и ролл к кольцу.</text>
<text x="60" y="1032" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X2 и X3 — на шаг в помощь, но готовы к переводу.</text>
<text x="60" y="1082" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · сплошная — рывок · оранжевый — защита</text>
</svg>