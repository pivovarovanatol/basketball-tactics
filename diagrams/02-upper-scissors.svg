<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1102" viewBox="0 0 800 1102">
<rect width="800" height="1102" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Верхний скрест</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">split cuts / scissors (high)</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M190 86 L190.0 169.4" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="190.0,175.0 185.8,167.0 194.2,167.0" fill="#6B6A64"/><path d="M288 132 C220 145 160 150 150.5 249.4" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="150.0,255.0 146.6,246.6 154.9,247.4" fill="#534AB7"/><path d="M92 132 C160 145 220 150 229.5 249.4" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="230.0,255.0 225.1,247.4 233.4,246.6" fill="#534AB7"/><circle cx="190" cy="70" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="74.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="202" cy="59" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M197 59 L207 59 M202 54 L202 64" stroke="#854F0B" stroke-width="0.6"/><circle cx="190" cy="190" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="194.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="300" cy="125" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="300" y="129.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="80" cy="125" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="129.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="168" cy="94" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="168" y="98.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="190" cy="220" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="224.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="296" cy="152" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="296" y="156.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="84" cy="152" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="84" y="156.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="320" cy="268" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="320" y="272.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="204" cy="118" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="204" y="121.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="242" cy="126" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="242" y="129.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="138" cy="126" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="138" y="129.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Та же расстановка, но рывки скрещиваются над O5 —</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">между ним и мячом — и уходят в зону по бокам от него.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 отдаёт пас на O5.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O3 режет по диагонали над O5, впритирку.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O4 режет следом, за спиной O3.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Чтение O5: защитник отстал — хэндофф пробегающему;</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">защитник перекрыл сверху — пас на ход в зону;</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">защитники поменялись — мяч тому, у кого мисматч.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · сплошная — рывок · пунктир — пас · цифры — порядок</text>
</svg>