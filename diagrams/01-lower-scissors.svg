<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1102" viewBox="0 0 800 1102">
<rect width="800" height="1102" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Нижний скрест</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">split cuts / scissors (low)</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M190 86 L190.0 157.4" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="190.0,163.0 185.8,155.0 194.2,155.0" fill="#6B6A64"/><path d="M288 132 Q200 160 166.8 256.7" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="165.0,262.0 163.6,253.1 171.6,255.8" fill="#534AB7"/><path d="M92 132 Q180 160 213.2 256.7" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="215.0,262.0 208.4,255.8 216.4,253.1" fill="#534AB7"/><circle cx="190" cy="70" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="74.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="202" cy="59" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M197 59 L207 59 M202 54 L202 64" stroke="#854F0B" stroke-width="0.6"/><circle cx="190" cy="178" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="182.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="300" cy="125" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="300" y="129.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="80" cy="125" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="129.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="178" cy="124" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="178" y="127.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="256" cy="166" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="256" y="169.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="124" cy="166" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="124" y="169.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Расстановка: O1 наверху с мячом, O5 на линии штрафного,</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">O3 и O4 высоко на крыльях, углы пустые.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 отдаёт пас на O5.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O3 режет по диагонали мимо O5 к кольцу, впритирку.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O4 режет следом, за спиной O3. Пути скрещиваются</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    между O5 и кольцом, O3 и O5 работают как заслон.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Чтение O5: чаще всего пас в зону на ход под лэй-ап.</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Если защита провалилась в зону — O5 бросает или идёт сам.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · «Т» — заслон · цифры — порядок</text>
</svg>