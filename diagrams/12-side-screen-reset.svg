<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1068" viewBox="0 0 800 1068">
<rect width="800" height="1068" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Ресет на другую сторону</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">защита при своих</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M146 98 L226.4 98.0" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="232.0,98.0 224.0,102.2 224.0,93.8" fill="#6B6A64"/><path d="M148 156 Q210 170 254.7 231.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,236.0 249.9,232.0 256.7,227.1" fill="#534AB7"/><path d="M308 166 Q190 214 81.2 170.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="76.0,168.0 85.0,167.1 81.8,174.9" fill="#534AB7"/><path d="M332 280 Q190 238 55.4 276.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="50.0,278.0 56.5,271.8 58.8,279.8" fill="#534AB7"/><circle cx="130" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="130" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="262" cy="89" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M257 89 L267 89 M262 84 L262 94" stroke="#854F0B" stroke-width="0.6"/><circle cx="134" cy="148" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="134" y="152.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="190" cy="84" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="190" y="87.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="276" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="276" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="300" cy="196" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="300" y="199.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="316" cy="252" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="316" y="255.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Защитники остались при своих — ресет.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 отдаёт O2, теперь ведущий — O2 справа сверху.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O5 переходит на правый блок.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O3 и 4. O4 перебегают на левую сторону —</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    теперь она слабая. O1 остаётся сверху слева.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Дальше то же самое с другой стороны:</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    O5 по сигналу выходит на заслон для O2.</text>
<text x="60" y="1014" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · «Т» — заслон · цифры — порядок</text>
</svg>