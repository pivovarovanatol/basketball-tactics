<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1034" viewBox="0 0 800 1034">
<rect width="800" height="1034" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Если смена</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">мисматч в зоне</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M148 152 Q180 200 183.6 250.4" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="184.0,256.0 179.2,248.3 187.6,247.7" fill="#534AB7"/><path d="M96 164 Q110 240 166.4 245.5" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="172.0,246.0 163.6,249.4 164.4,241.0" fill="#6B6A64"/><circle cx="100" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="100" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="112" cy="139" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M107 139 L117 139 M112 134 L112 144" stroke="#854F0B" stroke-width="0.6"/><circle cx="120" cy="182" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="120" y="186.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="138" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="138" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="150" cy="116" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="150" y="120.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="232" cy="124" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="128.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="296" cy="184" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="296" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="312" cy="264" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="312" y="268.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><text x="82" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D85A30">смена</text><circle cx="198" cy="200" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="198" y="203.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="96" cy="246" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="96" y="249.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Смена: X5 переходит на O1, маленький X1 — на O5.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O5 сразу проваливается в зону, закрывая X1 спиной.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. Пас O5 под кольцо — большой против маленького.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Или O1 сам атакует медленного X5 по пустой стороне.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Кто-то со слабой стороны помог на O5 — отдача</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    открытому: O4 в угол или O3 на крыло.</text>
<text x="60" y="980" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · «Т» — заслон · цифры — порядок</text>
</svg>