<g transform="translate(10 110)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Двое сверху в щели</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 3-2</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M150 125 L152.5 154.4" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="153.0,160.0 148.1,152.4 156.5,151.7" fill="#534AB7"/><path d="M160 172 L176.2 189.9" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="180.0,194.0 171.5,190.9 177.7,185.3" fill="#6B6A64"/><path d="M332 290 Q280 300 237.4 289.4" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="232.0,288.0 240.8,285.9 238.7,294.0" fill="#534AB7"/><path d="M194 218 L219.7 274.9" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="222.0,280.0 214.9,274.4 222.5,271.0" fill="#6B6A64"/><circle cx="148" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="148" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="160" cy="101" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M155 101 L165 101 M160 96 L160 106" stroke="#854F0B" stroke-width="0.6"/><circle cx="232" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="232" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="190" cy="204" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="208.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="40" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="40" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="190" cy="148" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="152.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="110" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="270" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="270" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="150" cy="252" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="150" y="256.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="224" cy="214" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="224" y="218.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><text x="250" y="236" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D85A30">X5 вышел</text><circle cx="130" cy="142" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="130" y="145.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="156" cy="192" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="156" y="195.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="292" cy="278" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="292" y="281.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="196" cy="256" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="196" y="259.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Двое сверху — в щели между тремя верхними.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O1 и O2 сверху, O5 на штрафной, O3 и O4 в углах.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 проходит в щель между X2 и X1 — оба на него.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. Пас на O5 в середину: внизу трое против двух.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. X5 вышел на O5 — O4 из угла режет по лицевой.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">4. O5 отдаёт O4 под кольцо.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X1 и X2 не сжались — O1 бросает или идёт до конца.</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X3 помог на O5 — открыт O2 сверху.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text></g>
<g transform="translate(810 110)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Через угол в пост</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 3-2</text>
