13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="258" y="236.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="40" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="40" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="190" cy="148" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="152.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="110" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="270" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="270" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="230" cy="280" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="230" y="284.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="314" cy="290" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="314" y="294.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="344" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="344" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="300" cy="236" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="300" y="239.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="100" cy="300" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="100" y="303.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="206" cy="284" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="206" y="287.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Через угол — в пост. Внизу всего двое защитников.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. Мяч на крыле у O2 — отдаёт в угол на O4.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Нижний X5 вынужден выйти в угол, X4 смещается к O5.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O4 отдаёт O5 в пост.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. Левая сторона пустая — O3 уходит из угла под кольцо,</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">4. O5 отдаёт ему — лэй-ап с другой стороны.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Никто не сместился — O5 играет один в один у кольца.</text>
<text x="60" y="1014" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text></g>
<g transform="translate(10 1212)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Скип-пас в дальний угол</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 3-2</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M78 182 L324.7 272.1" fill="none" stroke="#6B6A64" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="330.0,274.0 321.0,275.2 323.9,267.3" fill="#6B6A64"/><path d="M188 210 L245.6 256.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="250.0,260.0 241.1,258.2 246.4,251.7" fill="#534AB7"/><path d="M334 274 L269.5 264.8" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="264.0,264.0 272.5,261.0 271.3,269.3" fill="#6B6A64"/><circle cx="62" cy="176" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="62" y="180.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="74" cy="165" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M69 165 L79 165 M74 160 L74 170" stroke="#854F0B" stroke-width="0.6"/><circle cx="232" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="232" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="180" cy="196" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="180" y="200.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="40" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="40" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="94" cy="196" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="94" y="200.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="160" cy="158" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="160" y="162.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="240" cy="168" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="240" y="172.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="108" cy="260" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="108" y="264.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="322" cy="250" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="322" y="254.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="120" cy="214" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="120" y="217.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="238" cy="224" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="238" y="227.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="300" cy="284" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="300" y="287.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Скип-пас: зона съехала — дальний угол пустой.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Мяч на левом крыле, вся зона сдвинулась влево.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 через всю площадку в правый угол на O4.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    X5 не успевает — бросок с угла.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. X5 летит в угол — O5 ныряет на правый блок.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O4 отдаёт O5 под кольцо.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Лучше всего после двух-трёх быстрых передач:</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    зона устаёт сдвигаться.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text></g>
</svg>