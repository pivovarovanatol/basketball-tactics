<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1102" viewBox="0 0 800 1102">
<rect width="800" height="1102" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Заслон для ведущего</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">расстановка и проход</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M150 242 Q118 176 139.0 136.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><line x1="147.0" y1="140.2" x2="131.0" y2="131.8" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><path d="M146 96 L166.5 92.1" fill="none" stroke="#534AB7" stroke-width="1.3" stroke-linecap="round"/><polygon points="172.0,91.0 164.9,96.6 163.4,88.4" fill="#534AB7"/><path d="M116 110 Q78 180 116.7 233.5" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="120.0,238.0 111.9,234.0 118.7,229.1" fill="#534AB7"/><circle cx="130" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="130" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="142" cy="89" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M137 89 L147 89 M142 84 L142 94" stroke="#854F0B" stroke-width="0.6"/><circle cx="148" cy="122" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="148" y="126.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="232" cy="124" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="128.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="296" cy="184" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="296" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="312" cy="264" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="312" y="268.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="148" cy="256" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="148" y="260.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="168" cy="282" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="168" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><text x="176" y="78" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#534AB7">финт</text><circle cx="154" cy="204" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="154" y="207.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="196" cy="104" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="196" y="107.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="72" cy="214" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="72" y="217.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">O1 и O2 сверху, O5 на блоке со стороны мяча,</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">O3 на 45° и O4 в углу — на слабой стороне.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. По сигналу O5 выходит и ставит заслон на X1</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    (сзади — бэкскрин, или сбоку).</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O1 делает финт в одну сторону...</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. ...и резко уходит в другую, через заслон.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X1 застрял на заслоне — проход в зону и лэй-ап:</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    сторона пустая, помочь некому.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · сплошная — рывок · оранжевый — защита</text>
</svg>