<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1102" viewBox="0 0 800 1102">
<rect width="800" height="1102" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Бегун по лицевой</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 2-3</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M306 176 L208.7 115.0" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="204.0,112.0 213.0,112.7 208.5,119.8" fill="#6B6A64"/><path d="M176 112 L81.0 161.4" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="76.0,164.0 81.2,156.6 85.0,164.0" fill="#6B6A64"/><path d="M330 300 Q190 316 57.5 296.8" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="52.0,296.0 60.5,293.0 59.3,301.3" fill="#534AB7"/><path d="M60 186 L48.8 266.5" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="48.0,272.0 44.9,263.5 53.3,264.7" fill="#6B6A64"/><circle cx="190" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="318" cy="184" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="318" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="330" cy="173" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M325 173 L335 173 M330 168 L330 178" stroke="#854F0B" stroke-width="0.6"/><circle cx="62" cy="172" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="62" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="345" cy="284" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="288.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="160" cy="208" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="160" y="212.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="200" cy="165" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="200" y="169.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="300" cy="210" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="300" y="214.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="165" cy="262" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="165" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="232" cy="262" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="298" cy="262" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="298" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="262" cy="132" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="262" y="135.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="120" cy="128" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="120" y="131.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="260" cy="296" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="260" y="299.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="40" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="40" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Зона сдвигается за мячом — бьём туда, где пусто.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Мяч справа, зона сдвинулась вправо, O3 — в правом углу.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1–2. Быстрый перевод мяча: O2 → O1 → O4.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. Тем временем O3 бежит по лицевой под зоной</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    из правого угла в левый.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">4. O4 отдаёт в угол — открытый бросок с угла.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X3 вышел в угол — открыт O4 на крыле или O5.</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Можно и сразу скип-пасом через всю площадку.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text>
</svg>