<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1136" viewBox="0 0 800 1136">
<rect width="800" height="1136" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Pin-down на слабой стороне</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">защита</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M335 278 Q330 200 249.6 192.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="244.0,192.0 252.4,188.6 251.6,196.9" fill="#534AB7"/><path d="M282 254 L217.1 281.8" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="212.0,284.0 217.7,277.0 221.0,284.7" fill="#534AB7"/><path d="M286 224 L272.4 195.1" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="270.0,190.0 277.2,195.5 269.6,199.0" fill="#D85A30"/><path d="M326 258 Q300 214 237.6 210.3" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="232.0,210.0 240.2,206.3 239.7,214.7" fill="#D85A30"/><circle cx="65" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="65" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="77" cy="139" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M72 139 L82 139 M77 134 L77 144" stroke="#854F0B" stroke-width="0.6"/><circle cx="292" cy="242" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="292" y="246.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="340" cy="290" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340" y="294.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="262" cy="176" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="262" y="180.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="218" cy="208" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="218" y="212.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><text x="244" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#A32D2D">O3 открыт</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Ошибка: оба защитника уходят за выходящим из угла.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O3 ставит pin-down для O2. Без смены роли такие:</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X2 — «lock and trail»: прилипает к бедру O2 и идёт за ним.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X3 — «show and recover»: шаг-полтора, притормозить O2,</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    и сразу назад к O3.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Если X3 остаётся на O2 — заслонщик O3 свободен:</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">ныряет к кольцу (slip) или выходит на бросок (pop).</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Лечится: X3 заранее кричит «заслон!», роли чёткие,</text>
<text x="60" y="1032" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">а при одинаковом росте — просто смена (switch).</text>
<text x="60" y="1082" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · сплошная — рывок · оранжевый — защита</text>
</svg>