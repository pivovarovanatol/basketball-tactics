<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1136" viewBox="0 0 800 1136">
<rect width="800" height="1136" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Pin-down на слабой стороне</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">защита</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M330 169 L310.0 246.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><line x1="301.3" y1="243.7" x2="318.7" y2="248.3" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><path d="M342 276 Q345 200 249.6 205.7" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="244.0,206.0 251.7,201.3 252.2,209.7" fill="#534AB7"/><path d="M298 252 L219.3 280.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="214.0,282.0 220.1,275.4 222.9,283.3" fill="#534AB7"/><path d="M288 188 L269.2 195.0" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="264.0,197.0 270.0,190.3 273.0,198.1" fill="#D85A30"/><circle cx="65" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="65" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="77" cy="139" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M72 139 L82 139 M77 134 L77 144" stroke="#854F0B" stroke-width="0.6"/><circle cx="334" cy="156" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="334" y="160.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="340" cy="290" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340" y="294.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="300" cy="182" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="300" y="186.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="312" cy="264" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="312" y="268.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><text x="250" y="302" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#A32D2D">O3 открыт</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Ошибка: оба защитника уходят за выходящим из угла.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O3 ставит pin-down для O2. Без смены роли такие:</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X2 — «lock and trail»: прилипает к бедру O2 и идёт за ним.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X3 — «show and recover»: шаг-полтора, притормозить O2,</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    и сразу назад к O3.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Если X3 остаётся на O2 — заслонщик O3 свободен:</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">ныряет к кольцу (slip) или выходит на бросок (pop).</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Лечится: X3 заранее кричит «заслон!», роли чёткие,</text>
<text x="60" y="1032" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">а при одинаковом росте — просто смена (switch).</text>
<text x="60" y="1082" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · «Т» — заслон · оранжевый — защита</text>
</svg>