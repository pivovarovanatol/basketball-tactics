<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="2334" viewBox="0 0 1620 2334">
<rect width="1620" height="2334" fill="#F1EFE8"/>
<text x="810.0" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2C2C2A">Заслон для ведущего сверху</text>
<g transform="translate(10 110)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Заслон для ведущего</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">расстановка и проход</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M150 242 Q168 196 136.0 148.0" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><line x1="143.5" y1="143.0" x2="128.5" y2="153.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><path d="M146 96 L166.5 92.1" fill="none" stroke="#534AB7" stroke-width="1.3" stroke-linecap="round"/><polygon points="172.0,91.0 164.9,96.6 163.4,88.4" fill="#534AB7"/><path d="M116 110 Q78 180 116.7 233.5" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="120.0,238.0 111.9,234.0 118.7,229.1" fill="#534AB7"/><circle cx="130" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="130" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="142" cy="89" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M137 89 L147 89 M142 84 L142 94" stroke="#854F0B" stroke-width="0.6"/><circle cx="148" cy="122" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="148" y="126.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="232" cy="124" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="128.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="296" cy="184" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="296" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="312" cy="264" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="312" y="268.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="148" cy="256" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="148" y="260.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="168" cy="282" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="168" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><text x="176" y="78" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#534AB7">финт</text><circle cx="182" cy="206" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="182" y="209.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="196" cy="104" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="196" y="107.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="72" cy="214" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="72" y="217.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">O1 и O2 сверху, O5 на блоке со стороны мяча,</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">O3 на 45° и O4 в углу — на слабой стороне.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. По сигналу O5 выходит и ставит заслон на X1</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    (сзади — бэкскрин, или сбоку).</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O1 делает финт в одну сторону...</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. ...и резко уходит в другую, через заслон.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">X1 застрял на заслоне — проход в зону и лэй-ап:</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    сторона пустая, помочь некому.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">O — атака, X — защита · сплошная — рывок · оранжевый — защита</text></g>
<g transform="translate(810 110)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Если смена</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">мисматч в зоне</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M148 152 Q180 200 183.6 250.4" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/><polygon points="184.0,256.0 179.2,248.3 187.6,247.7" fill="#534AB7"/><path d="M96 164 Q110 240 166.4 245.5" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="172.0,246.0 163.6,249.4 164.4,241.0" fill="#6B6A64"/><circle cx="100" cy="150" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="100" y="154.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="112" cy="139" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M107 139 L117 139 M112 134 L112 144" stroke="#854F0B" stroke-width="0.6"/><circle cx="120" cy="182" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="120" y="186.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="138" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="138" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="150" cy="116" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="150" y="120.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="232" cy="124" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="232" y="128.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="296" cy="184" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="296" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="312" cy="264" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="312" y="268.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><text x="82" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#D85A30">смена</text><circle cx="198" cy="200" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="198" y="203.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="96" cy="246" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="96" y="249.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Смена: X5 переходит на O1, маленький X1 — на O5.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O5 сразу проваливается в зону, закрывая X1 спиной.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. Пас O5 под кольцо — большой против маленького.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Или O1 сам атакует медленного X5 по пустой стороне.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Кто-то со слабой стороны помог на O5 — отдача</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    открытому: O4 в угол или O3 на крыло.</text>
<text x="60" y="980" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · «Т» — заслон · цифры — порядок</text></g>
<g transform="translate(10 1212)"><rect x="5" y="5" width="790" height="1092" rx="14" fill="#FFFFFF"/><text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">Ресет на другую сторону</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">защита при своих</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M146 98 L226.4 98.0" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="232.0,98.0 224.0,102.2 224.0,93.8" fill="#6B6A64"/><path d="M148 156 Q210 170 254.7 231.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,236.0 249.9,232.0 256.7,227.1" fill="#534AB7"/><path d="M308 166 Q190 214 81.2 170.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="76.0,168.0 85.0,167.1 81.8,174.9" fill="#534AB7"/><path d="M332 280 Q190 238 55.4 276.5" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round"/><polygon points="50.0,278.0 56.5,271.8 58.8,279.8" fill="#534AB7"/><circle cx="130" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="130" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="250" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="262" cy="89" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M257 89 L267 89 M262 84 L262 94" stroke="#854F0B" stroke-width="0.6"/><circle cx="134" cy="148" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="134" y="152.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="322" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="322" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="190" cy="84" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="190" y="87.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="276" cy="226" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="276" y="229.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="300" cy="196" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="300" y="199.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text><circle cx="316" cy="252" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="316" y="255.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">4</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Защитники остались при своих — ресет.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 отдаёт O2, теперь ведущий — O2 справа сверху.</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O5 переходит на правый блок.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. O3 и 4. O4 перебегают на левую сторону —</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    теперь она слабая. O1 остаётся сверху слева.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Дальше то же самое с другой стороны:</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">    O5 по сигналу выходит на заслон для O2.</text>
<text x="60" y="1014" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · «Т» — заслон · цифры — порядок</text></g>
</svg>