ll="#FDF7F4" stroke="#E6BFAF" stroke-width="1"/><text x="318" y="270.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C69A88">X2</text><circle cx="110" cy="174" r="13" fill="#FDF7F4" stroke="#E6BFAF" stroke-width="1"/><text x="110" y="178.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C69A88">X3</text><circle cx="125" cy="252" r="13" fill="#FDF7F4" stroke="#E6BFAF" stroke-width="1"/><text x="125" y="256.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C69A88">X4</text><circle cx="288" cy="112" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="288" y="116.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="300" cy="101" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M295 101 L305 101 M300 96 L300 106" stroke="#854F0B" stroke-width="0.6"/><circle cx="250" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="345" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="345" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="80" cy="140" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="144.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="35" cy="282" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="35" y="286.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="228" cy="94" 