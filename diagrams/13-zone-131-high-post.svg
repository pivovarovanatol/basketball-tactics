<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1102" viewBox="0 0 800 1102">
<rect width="800" height="1102" fill="#FFFFFF"/>
<text x="60" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C2C2A">1-3-1 через высокий пост</text>
<text x="740" y="52" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#888780">против зоны 2-3</text>
<g transform="translate(20 80) scale(2)"><rect x="20" y="20" width="340" height="290" fill="#FBF6EC" stroke="#A9A69B" stroke-width="1"/><rect x="140" y="190" width="100" height="120" fill="#F3EBDB" stroke="#A9A69B" stroke-width="1"/><path d="M140 190 A50 50 0 0 1 240 190" fill="none" stroke="#A9A69B" stroke-width="1"/><path d="M40 310 L40 250 Q190 60 340 250 L340 310" fill="none" stroke="#A9A69B" stroke-width="1"/><line x1="172" y1="300" x2="208" y2="300" stroke="#A9A69B" stroke-width="1.5"/><circle cx="190" cy="292" r="6" fill="none" stroke="#D85A30" stroke-width="1.4"/><path d="M202 114 L301.2 173.1" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="306.0,176.0 297.0,175.5 301.3,168.3" fill="#6B6A64"/><path d="M238 170 L264.4 168.3" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="270.0,168.0 262.3,172.7 261.8,164.3" fill="#D85A30"/><path d="M306 188 L225.6 195.5" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="220.0,196.0 227.6,191.1 228.4,199.4" fill="#6B6A64"/><path d="M190 250 L195.0 221.5" fill="none" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="196.0,216.0 198.7,224.6 190.5,223.1" fill="#D85A30"/><path d="M194 208 L96.8 267.1" fill="none" stroke="#6B6A64" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="92.0,270.0 96.7,262.3 101.0,269.4" fill="#6B6A64"/><circle cx="190" cy="100" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="190" y="104.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O1</text><circle cx="202" cy="89" r="5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.8"/><path d="M197 89 L207 89 M202 84 L202 94" stroke="#854F0B" stroke-width="0.6"/><circle cx="320" cy="184" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="320" y="188.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O2</text><circle cx="62" cy="160" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="62" y="164.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O3</text><circle cx="205" cy="198" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="205" y="202.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O5</text><circle cx="80" cy="278" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="80" y="282.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">O4</text><circle cx="155" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="155" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X1</text><circle cx="225" cy="172" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="225" y="176.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X2</text><circle cx="150" cy="262" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="150" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X3</text><circle cx="190" cy="262" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="266.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X5</text><circle cx="272" cy="250" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="272" y="254.3" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#712B13">X4</text><circle cx="262" cy="132" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="262" y="135.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">1</text><circle cx="262" cy="206" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="262" y="209.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">2</text><circle cx="126" cy="232" r="7.5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="0.8"/><text x="126" y="235.6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2C2C2A">3</text></g>
<text x="60" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C2C2A">Нечётная расстановка 1-3-1 против чётной 2-3.</text>
<text x="60" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O1 наверху между двумя верхними, O5 на штрафной,</text>
<text x="60" y="828" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">O2 и O3 на крыльях, O4 у лицевой под кольцом.</text>
<text x="60" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">1. O1 отдаёт на крыло O2, X2 выходит на него.</text>
<text x="60" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">2. O2 сразу на O5 в середину — это дыра зоны.</text>
<text x="60" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">3. X5 вышел на O5 — пас под кольцо на O4.</text>
<text x="60" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Не вышел — O5 бросает со штрафной или идёт сам.</text>
<text x="60" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#2C2C2A">Помог X3 — перевод на O3 на дальнее крыло.</text>
<text x="60" y="1048" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#888780">Сплошная — рывок · пунктир — пас · оранжевый — защита · цифры — порядок</text>
</svg>